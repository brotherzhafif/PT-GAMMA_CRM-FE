<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Chat Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">💬 Live Chat Dashboard</h1>
        <div class="text-sm bg-blue-700 px-3 py-1 rounded">
            Status Kiri: <span id="connection-status" class="font-bold text-yellow-300">Connecting...</span> | 
            Kanan: <span id="chat-status" class="font-bold text-gray-300">Idle</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- SEBELAH KIRI: Daftar Latest Messages -->
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700">Latest Conversations</h2>
                <div class="flex items-center space-x-2 text-sm">
                    <label for="limit-input" class="text-gray-500">Limit:</label>
                    <input type="number" id="limit-input" value="50" min="1" max="100" class="w-16 p-1 border rounded text-center">
                </div>
            </div>
            
            <div id="latest-messages-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <div class="p-4 text-center text-gray-400">Loading conversations...</div>
            </div>
        </div>

        <!-- SEBELAH KANAN: Detail Message -->
        <div class="w-2/3 flex flex-col bg-gray-50">
            <div id="chat-header" class="p-4 bg-white border-b border-gray-200 shadow-sm hidden">
                <h2 id="active-contact-name" class="font-bold text-lg text-gray-800">-</h2>
                <p id="active-contact-number" class="text-xs text-gray-500">-</p>
            </div>

            <!-- Area Isi Chat -->
            <div id="chat-history-container" class="flex-1 p-6 overflow-y-auto flex flex-col space-y-3">
                <div class="m-auto text-center text-gray-400">
                    <p class="text-lg font-medium">Pilih percakapan di sebelah kiri</p>
                    <p class="text-sm">Pesan akan mengalir secara realtime di sini.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const BASE_URL = "https://ai-crm.brotherzhafif.my.id/api/messages"; 
        
        let latestEventSource = null;
        let chatHistoryEventSource = null; 
        let activeNumber = null;

        const latestListEl = document.getElementById('latest-messages-list');
        const statusEl = document.getElementById('connection-status');
        const chatStatusEl = document.getElementById('chat-status');
        const limitInput = document.getElementById('limit-input');
        
        const chatHeader = document.getElementById('chat-header');
        const activeNameEl = document.getElementById('active-contact-name');
        const activeNumberEl = document.getElementById('active-contact-number');
        const chatHistoryContainer = document.getElementById('chat-history-container');

        // --- 1. SSE UNTUK LIST KIRI (LATEST MESSAGES) ---
        function connectLatestSSE() {
            if (latestEventSource) {
                latestEventSource.close(); 
            }

            const limit = limitInput.value || 50;
            latestEventSource = new EventSource(`${BASE_URL}/latest?limit=${limit}`);

            latestEventSource.onopen = () => {
                statusEl.textContent = "Connected";
                statusEl.className = "font-bold text-green-400";
            };

            latestEventSource.onerror = (err) => {
                console.error("Latest SSE Error:", err);
                statusEl.textContent = "Disconnected";
                statusEl.className = "font-bold text-red-400";
            };

            const handleMessageData = (event) => {
                try {
                    const messages = JSON.parse(event.data);
                    // Langsung re-render list kiri setiap ada event data baru (initial maupun update)
                    renderLatestMessages(messages);
                } catch (e) {
                    console.error("Gagal parsing data Latest SSE:", e);
                }
            };

            // Daftarkan ke semua kemungkinan nama event dari FastAPI
            latestEventSource.addEventListener('message', handleMessageData);
            latestEventSource.addEventListener('initial', handleMessageData);
            latestEventSource.addEventListener('update', handleMessageData);
        }

        // --- 2. RENDER DAFTAR PESAN TERBARU DI SISI KIRI ---
        function renderLatestMessages(messages) {
            if (!messages || messages.length === 0) {
                latestListEl.innerHTML = '<div class="p-4 text-center text-gray-400">Tidak ada pesan.</div>';
                return;
            }

            latestListEl.innerHTML = '';
            messages.forEach(msg => {
                const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const isSelected = msg.sender_number === activeNumber;
                
                const item = document.createElement('div');
                item.setAttribute('data-number', msg.sender_number);
                item.className = `conversation-item p-4 cursor-pointer hover:bg-gray-50 transition flex flex-col space-y-1 ${isSelected ? 'bg-blue-50 border-l-4 border-blue-500 hover:bg-blue-50' : ''}`;
                
                const displayName = msg.name || msg.sender_number;
                const handoffBadge = msg.is_handoff ? `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded">HANDOFF</span>` : '';

                item.innerHTML = `
                    <div class="flex justify-between items-baseline">
                        <div class="font-semibold text-gray-900 truncate flex items-center space-x-1.5">
                            <span>${displayName}</span>
                            ${handoffBadge}
                        </div>
                        <span class="text-xs text-gray-400 flex-shrink-0">${time}</span>
                    </div>
                    <div class="text-sm text-gray-500 truncate">
                        <span class="font-medium text-xs border rounded px-1 mr-1">${msg.direction === 'inbound' ? 'IN' : 'OUT'}</span>
                        ${msg.message_text || '[Media/No Text]'}
                    </div>
                `;

                // Gunakan wrapper function agar tidak memicu re-render looping yang tidak perlu
                item.onclick = () => {
                    selectConversation(msg.sender_number, displayName);
                };
                latestListEl.appendChild(item);
            });
        }

        // --- 3. SELEKSI KONTAK KIRI ---
        function selectConversation(number, name) {
            // Ubah header chat kanan
            chatHeader.classList.remove('hidden');
            activeNameEl.textContent = name;
            activeNumberEl.textContent = number;

            if (activeNumber !== number) {
                activeNumber = number;
                chatHistoryContainer.innerHTML = '<div class="m-auto text-gray-400">Connecting live chat stream...</div>';
                streamChatHistory(number);
            }

            // Atur highlight biru secara manual tanpa reset koneksi list kiri
            document.querySelectorAll('.conversation-item').forEach(el => {
                if (el.getAttribute('data-number') === number) {
                    el.classList.add('bg-blue-50', 'border-l-4', 'border-blue-500');
                } else {
                    el.classList.remove('bg-blue-50', 'border-l-4', 'border-blue-500');
                }
            });
        }

        // --- 4. SSE UNTUK GELEMBUNG CHAT SEBELAH KANAN ---
        function streamChatHistory(number) {
            if (chatHistoryEventSource) {
                chatHistoryEventSource.close();
            }

            chatHistoryEventSource = new EventSource(`${BASE_URL}/${number}?limit=50`);

            chatHistoryEventSource.onopen = () => {
                chatStatusEl.textContent = `Streaming: ${number}`;
                chatStatusEl.className = "font-bold text-green-400";
            };

            chatHistoryEventSource.onerror = (err) => {
                console.error("Chat History SSE Error:", err);
                chatStatusEl.textContent = "Disconnected";
                chatStatusEl.className = "font-bold text-red-400";
            };

            const handleChatStream = (event) => {
                try {
                    const chatLogs = JSON.parse(event.data);
                    renderChatHistory(chatLogs);
                } catch (e) {
                    console.error("Gagal parsing data Chat History SSE:", e);
                }
            };

            chatHistoryEventSource.addEventListener('message', handleChatStream);
            chatHistoryEventSource.addEventListener('initial', handleChatStream);
            chatHistoryEventSource.addEventListener('update', handleChatStream);
        }

        // --- 5. RENDER DETAIL GELEMBUNG CHAT (DIURUTKAN KRONOLOGIS KE BAWAH) ---
        function renderChatHistory(chats) {
            if (!chats || chats.length === 0) {
                chatHistoryContainer.innerHTML = '<div class="m-auto text-gray-400">Belum ada riwayat pesan.</div>';
                return;
            }

            chatHistoryContainer.innerHTML = '';
            
            // PERBAIKAN UTAMA: Paksa pengurutan dari pesan paling LAMA ke paling BARU (asc)
            // Jadi pesan baru otomatis muncul mengalir di bagian paling bawah container
            const sortedChats = [...chats].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            sortedChats.forEach(chat => {
                const isMe = chat.direction === 'outbound'; 
                const time = new Date(chat.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                wrapper.innerHTML = `
                    <div class="max-w-[70%] rounded-lg p-3 shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 rounded-bl-none border border-gray-200'}">
                        <p class="text-sm break-words">${chat.message_text || '[Media/No Text]'}</p>
                        <p class="text-[10px] text-right mt-1 ${isMe ? 'text-blue-200' : 'text-gray-400'}">${time}</p>
                    </div>
                `;
                chatHistoryContainer.appendChild(wrapper);
            });

            // Beri sedikit delay untuk memastikan DOM selesai merender, lalu paksa gulir ke paling bawah
            setTimeout(() => {
                chatHistoryContainer.scrollTop = chatHistoryContainer.scrollHeight;
            }, 50);
        }

        // --- 6. EVENT LISTENERS ---
        limitInput.onchange = () => connectLatestSSE();
        connectLatestSSE();
    </script>
</body>
</html>
